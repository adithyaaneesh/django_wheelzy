<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 | Page Not Found – Wheelzy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #e3f2fd);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-box {
            background: #fff;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 520px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }

        .error-code {
            font-size: 100px;
            font-weight: 800;
            color: #1e88e5;
            margin-bottom: 10px;
        }

        .error-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .error-text {
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .btn-home {
            background: #000;
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 500;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-home:hover {
            background: #333;
            color: #fff;
        }

        .brand {
            margin-top: 30px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="error-box">
    <div class="error-code">404</div>
    <div class="error-title">Page Not Found</div>
    <p class="error-text">
        Oops! The page you're looking for doesn’t exist or has been moved.
        Let’s get you back on track 🚗💨
    </p>

    <a href="/" class="btn-home">Go Back Home</a>

    <div class="brand mt-4">
        © 2025 <strong>Wheelzy</strong>
    </div>
</div>

</body>
</html>
