{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle | Wheelzy</title>
    <link rel="icon" type="image/png" href="{% static 'images/wheelzy1.png' %}">
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #0f172a;
            --bg: linear-gradient(135deg, #fdf2f8 0%, #f3f4f6 100%);
            --card: rgba(255,255,255,0.88);
            --border: rgba(255,255,255,0.6);
            --shadow: 0 25px 60px rgba(0,0,0,0.15);
            --text-dark: #1e293b;
            --text-light: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
        }

        /* ===== FORM CARD ===== */
        .form-wrapper {
            width: 100%;
            max-width: 760px;
            background: var(--card);
            backdrop-filter: blur(14px);
            border-radius: 30px;
            padding: 36px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header .icon {
            width: 68px;
            height: 68px;
            border-radius: 22px;
            background: #eff6ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px;
        }

        .form-header h1 {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
        }

        .form-header p {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 6px;
        }

        /* ===== GRID ===== */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 24px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: span 2;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .input,
        select {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            outline: none;
            background: white;
        }

        .input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        /* ===== BUTTON ===== */
        .btn-submit {
            margin-top: 26px;
            width: 100%;
            padding: 14px;
            border-radius: 18px;
            border: none;
            background: var(--primary-dark);
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: var(--primary);
        }

        /* ===== BACK LINK ===== */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 720px) {
            .form-wrapper {
                margin: 20px;
                padding: 28px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<div class="form-wrapper">

    <div class="form-header">
        <div class="icon">
            <i class="fa-solid fa-car"></i>
        </div>
        <h1>Add New Vehicle</h1>
        <p>Enter vehicle details to list it on Wheelzy</p>
    </div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-grid">

            <div class="field">
                <label>Vehicle Name</label>
                <input type="text" name="vehicle_name" class="input"
                       placeholder="Eg: Hyundai i20" required>
            </div>

            <div class="field">
                <label>Vehicle Type</label>
                <select name="vehicle_type" required>
                    <option value="" disabled selected>Select type</option>
                    <option value="car">Car</option>
                    <option value="bike">Bike</option>
                </select>
            </div>

            <div class="field">
                <label>Number Plate</label>
                <input type="text" name="number_plate" class="input"
                       placeholder="TN 09 AB 1234" required>
            </div>

            <div class="field">
                <label>No. of Seats</label>
                <input type="number" name="number_of_seats" class="input"
                       placeholder="4" required>
            </div>

            <div class="field">
                <label>Price per Hour (₹)</label>
                <input type="number" name="price_per_hour" class="input"
                       placeholder="Eg: 299" required>
            </div>

            <div class="field">
                <label>Vehicle Image</label>
                <input type="file" name="image" class="input">
            </div>

        </div>

        <button type="submit" class="btn-submit">
            Add Vehicle
        </button>
    </form>

    <a href="{% url 'owner_dashboard' %}" class="back-link">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
