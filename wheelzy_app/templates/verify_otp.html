<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>

    <style>
        body {
            font-family: Segoe UI;
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #fff;
            padding: 30px;
            width: 340px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,.2);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1e88e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .timer {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
            font-weight: 600;
        }

        .resend {
            margin-top: 12px;
            font-size: 13px;
        }

        .resend a {
            color: #aaa;
            pointer-events: none;
            text-decoration: none;
            font-weight: 600;
        }

        .resend a.active {
            color: #1e88e5;
            pointer-events: auto;
        }

        .msg {
            margin-bottom: 10px;
            color: red;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Email Verification</h2>

    {% for message in messages %}
        <div class="msg">{{ message }}</div>
    {% endfor %}

    <form method="post">
        {% csrf_token %}
        <input type="text" name="otp" placeholder="Enter OTP" required>
        <button type="submit">Verify</button>
    </form>

    <!-- TIMER -->
    <div class="timer">
        Resend OTP in <span id="time">05:00</span>
    </div>

    <!-- RESEND -->
    <div class="resend">
        Didn’t get OTP?
        <a id="resendLink" href="{% url 'resend_otp' %}">Resend OTP</a>
    </div>
</div>

<script>
    let timeLeft = 300; // 5 minutes (in seconds)
    const timeDisplay = document.getElementById("time");
    const resendLink = document.getElementById("resendLink");

    const timer = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        timeDisplay.textContent =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");

        if (timeLeft <= 0) {
            clearInterval(timer);
            timeDisplay.textContent = "00:00";
            resendLink.classList.add("active");
        }

        timeLeft--;
    }, 1000);
</script>

</body>
</html>
