{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wheelzy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: #000; /* premium black background */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .splash {
            text-align: center;
            animation: fadeIn 1.2s ease-in-out;
        }

        .logo {
            width: 280px;
            animation: zoomIn 1.5s ease;
        }

        .tagline {
            margin-top: 14px;
            color: #cbd5f5;
            letter-spacing: 1px;
            font-size: 14px;
        }

        .loader {
            margin: 30px auto 0;
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255,255,255,0.25);
            border-top: 4px solid #ef4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>

    <!-- AUTO REDIRECT -->
    
</head>
<body>

<div class="splash">
    <!-- LOGO -->
    <img src="{% static 'images/wheelzy1.png' %}" alt="Wheelzy Logo" class="logo">

    <div class="tagline">Drive. Explore. Book.</div>

    <div class="loader"></div>
</div>

</body>
<script>
    setTimeout(() => {
        window.location.href = "{% url redirect_url %}";
    }, 2500);
</script>

</html>
