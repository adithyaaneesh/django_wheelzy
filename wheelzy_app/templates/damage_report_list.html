<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Damage Reports | Admin</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: 'Poppins', sans-serif;
            background: #f4f6fb;
            color: #111827;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .page-header h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
        }

        /* ================= CARD ================= */
        .report-card {
            background: #ffffff;
            padding: 22px 24px;
            border-radius: 16px;
            margin-bottom: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .report-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 45px rgba(0,0,0,0.12);
        }

        .report-info {
            flex: 1;
        }

        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .label {
            font-weight: 600;
            color: #374151;
        }

        /* ================= STATUS ================= */
        .status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .paid {
            background: #dcfce7;
            color: #166534;
        }

        .unpaid {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .report-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <!-- HEADER -->
    <div class="page-header">
        <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary">
            ← Back
        </a>
        <h2>🛠 All Damage Reports</h2>
        <div></div>
    </div>

    {% for report in reports %}
    <div class="report-card">

        <!-- LEFT INFO -->
        <div class="report-info">
            <div class="info-row">
                <div>
                    <span class="label">Vehicle:</span>
                    {{ report.vehicle.vehicle_name }}
                </div>

                <div>
                    <span class="label">Customer:</span>
                    {{ report.booking.user.username }}
                </div>

                <div>
                    <span class="label">Charge:</span>
                    ₹{{ report.extra_charge }}
                </div>
            </div>

            <span class="status {% if report.is_paid %}paid{% else %}unpaid{% endif %}">
                {% if report.is_paid %}Paid{% else %}Unpaid{% endif %}
            </span>
        </div>

        <!-- RIGHT ACTION -->
        <div>
            <a href="{% url 'admin_damage_report_detail' report.id %}"
               class="btn btn-primary">
                View Details
            </a>
        </div>

    </div>
    {% empty %}
        <div class="empty">
            No damage reports found.
        </div>
    {% endfor %}

</div>
</body>
</html>
