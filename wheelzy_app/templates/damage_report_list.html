<!DOCTYPE html>
<html>
<head>
    <title>Damage Reports</title>
    <style>
        body { font-family:Segoe UI; background:#f4f6fb; padding:30px; }
        .card {
            background:#fff;
            padding:20px;
            border-radius:14px;
            margin-bottom:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }
        .unpaid { color:red; font-weight:600; }
    </style>
</head>
<body>

<h2>All Damage Reports</h2>

{% for report in reports %}
<div class="card">
    <p><strong>Vehicle:</strong> {{ report.vehicle.name }}</p>
    <p><strong>Customer:</strong> {{ report.booking.user.username }}</p>
    <p><strong>Charge:</strong> ₹{{ report.extra_charge }}</p>
    <p class="{% if not report.is_paid %}unpaid{% endif %}">
        {% if report.is_paid %}Paid{% else %}Unpaid{% endif %}
    </p>
    <a href="{% url 'admin_damage_report_detail' report.id %}">View Details</a>
</div>
{% endfor %}

</body>
</html>
