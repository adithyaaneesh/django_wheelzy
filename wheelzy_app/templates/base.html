<!DOCTYPE html>
<html>
<head>
    <title>Wheelzy</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
        }

        /* Chat Widget Button */
        #ai-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        #chat-container {
            width: 320px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            padding: 15px;
            animation: fadeIn 0.3s ease-in-out;
        }

        #chat-container h4 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
        }

        #ai-message {
            width: 70%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
            transition: 0.2s;
        }

        #ai-message:focus {
            border-color: #4a90e2;
        }

        button {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        #ai-response {
            margin-top: 12px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
            color: #444;
        }

        #ai-response p {
            background-color: #f1f3f6;
            padding: 8px;
            border-radius: 8px;
            margin: 5px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
<input type="hidden" id="csrf-token" value="{{ csrf_token }}">

{% block content %}

{% endblock %}

<!-- AI Chatbot Here -->
{% if user.is_authenticated %}
<div id="ai-widget">
    <div id="chat-container">
        <h5>Wheelzy AI</h5>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="ai-message" placeholder="Ask Wheelzy AI..." onkeypress="if(event.key==='Enter'){sendAI()}">            <button onclick="sendAI()">Send</button>
        </div>
        <div id="ai-response"></div>
    </div>
</div>
{% endif %}

</body>
<script>
function sendAI() {
    
    const input = document.getElementById("ai-message");
    const message = input.value.trim();
    const responseBox = document.getElementById("ai-response");

    if (!message) return;

    // Show user message
    responseBox.innerHTML += `<p><b>You:</b> ${message}</p>`;
    responseBox.innerHTML += `<p><i>Typing...</i></p>`;
    fetch("/ai-chat/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": document.getElementById("csrf-token").value
        },
        body: JSON.stringify({ message: message })
    })
    .then(res => res.json())
    .then(data => {
        responseBox.innerHTML += `<p><b>AI:</b> ${data.reply}</p>`;
        responseBox.scrollTop = responseBox.scrollHeight;
    })
    .catch(() => {
        responseBox.innerHTML += `<p>Error connecting to AI</p>`;
    });

    input.value = "";
}
</script>
</html>
