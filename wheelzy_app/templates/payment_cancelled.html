{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Incomplete | Wheelzy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="{% static 'images/wheelzy1.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #fff1f2, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            max-width: 420px;
            width: 100%;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
            text-align: center;
            background: #ffffff;
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        h2 {
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .btn-primary {
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }

        .btn-outline-secondary {
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">✖</div>

    <h2>Payment Incomplete</h2>
    <p>
        Your payment was not completed.<br>
        This may be due to a network issue, bank decline, or the payment was cancelled.
    </p>

    <div class="d-grid gap-3">
       <a href="{% url 'my_bookings' %}" class="btn btn-primary">
            Go to My Bookings
        </a>

        <a href="{% url 'all_vehicles' %}" class="btn btn-outline-secondary">
            Browse Vehicles
        </a>

    </div>
</div>

</body>
</html>
