<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Wheelzy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6fb;
        }

        /* CARD */
        .login-wrapper {
            width: 100%;
            max-width: 980px;
            height: 570px;
            background: #fff;
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 25px 60px rgba(0,0,0,.25);
        }

        /* LEFT IMAGE */
        .login-image {
            flex: 1;
            background: url("/static/images/login-logo.jpg") center/cover no-repeat;
            position: relative;
        }

        .login-image::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,.15), rgba(0,0,0,.55));
        }

        .image-text {
            position: absolute;
            bottom: 28px;
            left: 28px;
            color: #fff;
            z-index: 1;
        }

        .image-text h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
        }

        .image-text p {
            font-size: 13px;
            opacity: .9;
            margin-top: 4px;
        }

        /* RIGHT FORM */
        .login-form {
            flex: 1;
            padding: 32px 36px; /* TIGHTER */
            color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand {
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 12px;
            margin-bottom: 14px;
            color: #1e88e5;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 24px;
        }

        .subtitle {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 18px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
        }

        input {
            width: 100%;
            padding: 11px 13px;
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1e88e5;
            box-shadow: 0 0 0 3px rgba(30,136,229,.18);
            background: #fff;
        }

        /* ROLE */
        .role-box {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .role-box label {
            flex: 1;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            transition: .25s;
        }

        .role-box input {
            display: none;
        }

        .role-box label:has(input:checked) {
            border-color: #1e88e5;
            background: #eef4ff;
            color: #1e88e5;
        }

        /* DEMO */
        .demo-title {
            font-size: 11px;
            color: #6b7280;
            text-align: center;
            margin: 6px 0 4px;
        }

        .demo-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .demo-btn {
            border: 1px dashed #1e88e5;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #1e88e5;
            cursor: pointer;
            transition: .2s;
        }

        .demo-btn:hover {
            background: #eef4ff;
        }

        /* BUTTON */
        button {
            background: linear-gradient(135deg, #1e88e5, #1987e7);
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(30,136,229,.35);
        }

        .signup {
            margin-top: 14px;
            font-size: 13px;
            text-align: center;
            color: #6b7280;
        }

        .signup a {
            color: #1e88e5;
            text-decoration: none;
            font-weight: 600;
        }
        @media (max-width: 768px) {

            body {
                background: url("/static/images/login-car.jpg") center / cover no-repeat fixed;
                position: relative;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: linear-gradient(
                    rgba(0,0,0,0.65),
                    rgba(0,0,0,0.85)
                );
                z-index: -1;
            }

            .login-wrapper {
                height: auto;
                max-width: 360px;
                border-radius: 28px;
                background: rgba(255,255,255,0.08);
                backdrop-filter: blur(14px);
                box-shadow: 0 25px 60px rgba(0,0,0,.6);
            }

            .login-image {
                display: none;
            }

            .login-form {
                padding: 28px 22px;
                color: #fff;
            }

            .login-form input {
                background: rgba(255,255,255,0.15);
                border: 1px solid rgba(255,255,255,0.25);
                color: #fff;
            }

            .login-form input::placeholder {
                color: rgba(255,255,255,0.7);
            }

            .login-form input:focus {
                background: rgba(255,255,255,0.2);
                border-color: #1e88e5;
            }

            .login-form h1,
            .login-form .brand,
            .login-form .subtitle,
            .login-form .signup,
            .login-form .signup a {
                color: #fff;
                text-align: center;
            }
        }

    </style>
</head>

<body>

<div class="login-wrapper">

    <!-- IMAGE -->
    <div class="login-image">
        <div class="image-text">
            <h2>Journey Beyond</h2>
            <p>Experience premium rides with Wheelzy</p>
        </div>
    </div>

    <!-- FORM -->
    <div class="login-form">
        <!-- {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %} -->
        <div class="brand">WHEELZY</div>

        <h1>Please Log In</h1>
        <div class="subtitle">Login to continue your journey</div>

        <form method="post">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" id="username" name="username" required>

            <label>Password</label>
            <input type="password" id="password" name="password" required>

            <!-- ROLE -->
            <div class="role-box">
                <label>
                    <input type="radio" name="role" value="customer" checked onclick="setRole('customer')">
                    Customer
                </label>
                <label>
                    <input type="radio" name="role" value="owner" onclick="setRole('owner')">
                    Owner
                </label>
                <label>
                    <input type="radio" name="role" value="admin" onclick="setRole('admin')">
                    Admin
                </label>
            </div>

            <!-- DEMO -->
            <div class="demo-title">Quick demo login</div>
            <div class="demo-box">
                <div class="demo-btn" onclick="fillDemo()">Use demo</div>
            </div>

            <button type="submit">LOGIN</button>
        </form>

        <div class="signup">
            Don’t have an account?
            <a href="{% url 'register' %}">Sign up</a>
        </div>
    </div>

</div>

<script>
    let selectedRole = "customer";

    const demoUsers = {
        customer: { username: "customer", password: "1234567890" },
        owner: { username: "owner", password: "1234567890" },
        admin: { username: "admin", password: "admin" }
    };

    function setRole(role) {
        selectedRole = role;
    }

    function fillDemo() {
        document.getElementById("username").value = demoUsers[selectedRole].username;
        document.getElementById("password").value = demoUsers[selectedRole].password;
    }
</script>

</body>
</html>
