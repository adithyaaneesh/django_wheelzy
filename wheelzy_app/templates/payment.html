{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | Wheelzy</title>
    <link rel="icon" type="image/png" href="{% static 'images/wheelzy1.png' %}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        :root {
            --brand-blue: #2563eb;
            --brand-dark: #0f172a;
            --bg-light: #f8fafc;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Inter', sans-serif;
            color: var(--brand-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .payment-card {
            max-width: 450px;
            margin: auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .card-header {
            background: var(--brand-dark);
            padding: 30px;
            text-align: center;
            border: none;
        }

        .brand-logo {
            height: 40px;
            margin-bottom: 10px;
        }

        .card-body {
            padding: 40px;
        }

        .amount-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .amount-display .label {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
            display: block;
        }

        .amount-display .value {
            font-size: 36px;
            font-weight: 800;
            color: var(--brand-dark);
        }

        .payment-details {
            background: #f1f5f9;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .detail-item:last-child { margin-bottom: 0; }

        .btn-pay {
            width: 100%;
            background: var(--brand-blue);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-pay:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
        }

        .trust-badges {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            opacity: 0.6;
            font-size: 20px;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="payment-card">
        <div class="card-header">
            <h4 class="text-white fw-bold m-0">WHEELZY</h4>
        </div>

        <div class="card-body">
            <div class="amount-display">
                <span class="label">Total Amount to Pay</span>
                <span class="value">₹{{ amount }}</span>
            </div>

            <div class="payment-details">
                <div class="detail-item">
                    <span class="text-muted">Order ID</span>
                    <span class="fw-medium text-truncate ms-3">{{ order_id }}</span>
                </div>
                <div class="detail-item">
                    <span class="text-muted">Service</span>
                    <span class="fw-medium">Vehicle Booking</span>
                </div>
            </div>

            <button id="rzp-button" class="btn-pay">
                <i class="fa-solid fa-shield-halved"></i> Pay Securely Now
            </button>

            <div class="trust-badges">
                <i class="fa-brands fa-cc-visa"></i>
                <i class="fa-brands fa-cc-mastercard"></i>
                <i class="fa-solid fa-lock" title="SSL Secured"></i>
            </div>

            <p class="footer-note">
                Your payment is secured with 128-bit encryption.<br>
                Powered by Razorpay
            </p>
        </div>
    </div>
</div>

<form id="razorpay-form" method="POST" action="{% url 'razorpay_verify' %}">
    {% csrf_token %}
    <input type="hidden" name="razorpay_payment_id" id="payment_id">
    <input type="hidden" name="razorpay_order_id" value="{{ order_id }}">
    <input type="hidden" name="razorpay_signature" id="signature">
</form>

<script>
var options = {
    "key": "{{ razorpay_key }}",
    "amount": "{{ amount|floatformat:0 }}00",
    "currency": "INR",
    "name": "Wheelzy",
    "description": "Vehicle Booking Payment",
    "order_id": "{{ order_id }}",
    "handler": function (response){
        // Add a loading state to UI
        document.getElementById("rzp-button").innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';
        document.getElementById("payment_id").value = response.razorpay_payment_id;
        document.getElementById("signature").value = response.razorpay_signature;
        document.getElementById("razorpay-form").submit();
    },
    "prefill": {
        "name": "{{ user.username }}",
        "email": "{{ user.email }}"
    },
    "theme": {
        "color": "#2563eb"
    }
};

var rzp = new Razorpay(options);

document.getElementById("rzp-button").onclick = function(e){
    rzp.open();
    e.preventDefault();
}

// Handle payment failure gracefully
rzp.on('payment.failed', function (response){
    alert("Payment Failed: " + response.error.description);
});
</script>

</body>
</html>
