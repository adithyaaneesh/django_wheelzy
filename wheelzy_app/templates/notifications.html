<!DOCTYPE html>
<html>
<head>
    <title>Notifications | Wheelzy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f4f6fb;
            padding: 30px;
        }

        .page-header {
            max-width: 800px;
            margin: auto;
            margin-bottom: 24px;
        }

        .page-header h2 {
            margin: 0;
        }

        .notification-list {
            max-width: 800px;
            margin: auto;
        }

        .note {
            background: white;
            padding: 16px 18px;
            margin-bottom: 14px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            cursor: pointer;
            position: relative;
            transition: background 0.3s ease, font-weight 0.3s ease;

        }

        .note.unread {
            background: #eef4ff;
            font-weight: 600;
        }

        .note-time {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 95%;
            max-width: 420px;
            border-radius: 16px;
            padding: 22px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #2563eb;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

{% csrf_token %}

<div class="page-header">
    <button class="back-btn" onclick="history.back()">← Back</button>
    <h2>🔔 Notifications</h2>
</div>

<div class="notification-list">
{% for note in notifications %}
<div class="note {% if not note.is_read %}unread{% endif %}"
     data-id="{{ note.id }}"
     data-message="{{ note.message|escapejs }}"
     data-time="{{ note.created_at|date:'d M Y, H:i' }}"
     onclick="openModal(this)">

    {{ note.message|truncatechars:70 }}
    <div class="note-time">{{ note.created_at|date:"d M Y, H:i" }}</div>
</div>
{% empty %}
<p>No notifications</p>
{% endfor %}
</div>

<div class="modal" id="notifModal">
    <div class="modal-content">
        <h3>Notification</h3>
        <p id="modalMessage"></p>
        <small id="modalTime"></small>

        <button class="btn" onclick="markReadAndClose()">
            Mark as read & Close
        </button>
    </div>
</div>

<script>
let currentNotifId = null;
let currentNotifElement = null;
let pollingPaused = true;

function openModal(el) {
    currentNotifId = el.dataset.id;
    currentNotifElement = el;
    document.getElementById("modalMessage").innerText = el.dataset.message;
    document.getElementById("modalTime").innerText = el.dataset.time;
    document.getElementById("notifModal").style.display = "flex";
}

function markReadAndClose() {
    fetch("{% url 'mark_notification_read' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: new URLSearchParams({ id: currentNotifId })
    }).then(() => {

        // ✅ remove unread UI immediately
        if (currentNotifElement) {
            currentNotifElement.classList.remove("unread");
        }

        // ✅ update bell count LOCALLY (no race)
        const badge = document.querySelector(".notif-count");
        if (badge) {
            let count = parseInt(badge.innerText);
            count = Math.max(0, count - 1);

            if (count === 0) {
                badge.remove();
            } else {
                badge.innerText = count;
            }
        }

        document.getElementById("notifModal").style.display = "none";
    });
}


function updateBellCount() {
    fetch("{% url 'unread_notification_count' %}")
        .then(res => res.json())
        .then(data => {
            const badge = document.querySelector(".notif-count");
            const bell = document.querySelector(".notification-bell");

            if (!bell) return;

            if (data.count > 0) {
                if (badge) {
                    badge.innerText = data.count;
                } else {
                    const span = document.createElement("span");
                    span.className = "notif-count";
                    span.innerText = data.count;
                    bell.appendChild(span);
                }
            } else if (badge) {
                badge.remove();
            }
        });
}

function refreshUnreadCount() {
    if (window.pollingPaused) return; // ✅ SAFETY

    fetch("{% url 'unread_notification_count' %}")
        .then(res => res.json())
        .then(data => {
            const bell = document.querySelector(".notification-bell");
            if (!bell) return;

            let badge = bell.querySelector(".notif-count");

            if (data.count > 0) {
                if (!badge) {
                    badge = document.createElement("span");
                    badge.className = "badge notif-count";
                    bell.appendChild(badge);
                }
                badge.innerText = data.count;
            } else if (badge) {
                badge.remove();
            }
        });
}

</script>

</body>
</html>
