<!DOCTYPE html>
<html lang="en">
<head>
    <title>Notifications | Wheelzy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --bg-gray: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        /* Header Styles */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header-left h2 {
            margin: 4px 0 0 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--primary-hover);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            height: 40px;
            width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: white;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--card-shadow);
        }

        .action-btn:hover {
            background: #f1f5f9;
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .action-btn.clear-read:hover {
            color: var(--danger);
            border-color: #fee2e2;
        }

        /* Notification List */
        .notification-card-wrapper {
            background: white;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05);
        }

        .note {
            padding: 20px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .note:last-child {
            border-bottom: none;
        }

        .note:hover {
            background-color: #f8fafc;
        }

        /* Unread State */
        .note.unread {
            background-color: #f0f7ff;
        }

        .note.unread::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
        }

        .note-content {
            font-size: 15px;
            color: var(--text-main);
            padding-right: 20px;
        }

        .unread .note-content {
            font-weight: 600;
        }

        .note-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Empty State */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: modalEntry 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalEntry {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal h3 {
            margin: 0 0 12px 0;
            font-size: 20px;
            font-weight: 700;
        }

        .modal p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        #confirmModal .modal-content {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="page-header">
        <div class="header-left">
            <button class="back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
            <h2>Notifications</h2>
        </div>

        <div class="actions">
            <button class="action-btn" title="Mark all as read" onclick="confirmMarkAllRead()">
                <i class="fa-regular fa-envelope-open"></i>
            </button>
            <button class="action-btn clear-read" title="Clear read" onclick="confirmClearRead()">
                <i class="fa-regular fa-trash-can"></i>
            </button>
        </div>
    </div>

    <div class="notification-card-wrapper">
        <div class="notification-list">
            {% for note in notifications %}
            <div class="note {% if not note.is_read %}unread{% endif %}"
                 data-id="{{ note.id }}"
                 data-message="{{ note.message|escapejs }}"
                 data-time="{{ note.created_at|date:'d M Y, H:i' }}"
                 onclick="openModal(this)">
                <div class="note-content">{{ note.message|truncatechars:85 }}</div>
                <div class="note-time">{{ note.created_at|date:"d M Y, H:i" }}</div>
            </div>
            {% empty %}
            <div class="empty-state">
                <i class="fa-regular fa-bell-slash"></i>
                <p>You're all caught up! No notifications here.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<div class="modal" id="notifModal">
    <div class="modal-content">
        <div style="color: var(--primary); margin-bottom: 16px; font-size: 24px;">
            <i class="fa-solid fa-circle-info"></i>
        </div>
        <h3>Notification Details</h3>
        <p id="modalMessage"></p>
        <div id="modalTime" style="font-size: 12px; color: var(--text-muted); margin-bottom: 24px; display: block;"></div>
        <button class="btn btn-primary" onclick="markReadAndClose()">Mark as read & Close</button>
        <button class="btn btn-secondary" onclick="notifModal.style.display='none'">Just Close</button>
    </div>
</div>

<div class="modal" id="confirmModal">
    <div class="modal-content">
        <h3 id="confirmTitle"></h3>
        <p id="confirmMessage"></p>
        <button class="btn btn-primary" id="confirmYesBtn">Yes, Continue</button>
        <button class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
    </div>
</div>

<script>
    // JS Logic remains identical to preserve your workflow
    let currentNotifId = null;
    let currentNotifElement = null;
    let confirmAction = null;

    const modalMessage = document.getElementById('modalMessage');
    const modalTime = document.getElementById('modalTime');
    const notifModal = document.getElementById('notifModal');
    const confirmModal = document.getElementById('confirmModal');
    const confirmTitle = document.getElementById('confirmTitle');
    const confirmMessage = document.getElementById('confirmMessage');
    const confirmYesBtn = document.getElementById('confirmYesBtn');

    function openModal(el) {
        currentNotifId = el.dataset.id;
        currentNotifElement = el;
        modalMessage.innerText = el.dataset.message;
        modalTime.innerText = el.dataset.time;
        notifModal.style.display = "flex";
    }

    function markReadAndClose() {
        fetch("{% url 'mark_notification_read' %}", {
            method: "POST",
            headers: { "X-CSRFToken": "{{ csrf_token }}" },
            body: new URLSearchParams({ id: currentNotifId })
        }).then(() => {
            currentNotifElement.classList.remove("unread");
            updateBadge(-1);
            notifModal.style.display = "none";
        });
    }

    function markAllRead() {
        fetch("{% url 'mark_all_notifications_read' %}", {
            method: "POST",
            headers: { "X-CSRFToken": "{{ csrf_token }}" }
        }).then(() => {
            document.querySelectorAll(".note.unread").forEach(n => n.classList.remove("unread"));
            removeBadge();
        });
    }

    function clearReadNotifications() {
        fetch("{% url 'clear_read_notifications' %}", {
            method: "POST",
            headers: { "X-CSRFToken": "{{ csrf_token }}" }
        }).then(() => {
            document.querySelectorAll(".note:not(.unread)").forEach(n => n.remove());
            // Check if empty after removal
            if(document.querySelectorAll(".note").length === 0) {
                location.reload(); // Refresh to show empty state
            }
        });
    }

    function updateBadge(delta) {
        const badge = document.querySelector(".notif-count");
        if (!badge) return;
        const count = Math.max(0, parseInt(badge.innerText) + delta);
        count ? badge.innerText = count : badge.remove();
    }

    function removeBadge() {
        const badge = document.querySelector(".notif-count");
        if (badge) badge.remove();
    }

    function openConfirmModal(title, message, action) {
        confirmTitle.innerText = title;
        confirmMessage.innerText = message;
        confirmAction = action;
        confirmModal.style.display = "flex";
    }

    function closeConfirmModal() {
        confirmAction = null;
        confirmModal.style.display = "none";
    }

    function confirmMarkAllRead() {
        openConfirmModal("Mark all as read?",
            "All unread notifications will be marked as read.",
            markAllRead);
    }

    function confirmClearRead() {
        openConfirmModal("Clear read notifications?",
            "All read notifications will be permanently removed.",
            clearReadNotifications);
    }

    confirmYesBtn.onclick = () => {
        if (confirmAction) confirmAction();
        closeConfirmModal();
    };

    // Close modals on background click
    window.onclick = function(event) {
        if (event.target == notifModal) notifModal.style.display = "none";
        if (event.target == confirmModal) closeConfirmModal();
    }
</script>

</body>
</html>
